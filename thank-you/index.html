<div class="box">
  <div class="eyebrow">DS100 Webinar</div>
  <h1>Thank you.</h1>
  <p>Your test registration has reached the thank-you page. In GA4, this page can be marked as the key conversion event.</p>
  <a class="btn" href="../">Back to Landing Page</a>
</div>
<script>
(function(){
  function safeParse(json){ try{return JSON.parse(json || '{}') || {}}catch(e){return {}} }
  function nowIso(){ return new Date().toISOString(); }
  function rememberEvent(payload){
    const safePayload = {
      event:payload.event || '',
      source:payload.source || '',
      medium:payload.medium || '',
      campaign:payload.campaign || '',
      content:payload.content || '',
      cta:payload.cta || '',
      session:payload.session || '',
      intent:payload.intent || '',
      referrer:payload.referrer || '',
      page_location:payload.page_location || '',
      event_time:nowIso()
    };
    const events = safeParse(sessionStorage.getItem('ds100_event_history') || '[]');
    events.push(safePayload);
    sessionStorage.setItem('ds100_event_history', JSON.stringify(events.slice(-50)));
  }
  const attr = safeParse(localStorage.getItem('ds100_attribution'));
  const p = new URLSearchParams(window.location.search);
  const payload = {
    event:'thank_you_view',
    source:attr.source || 'unknown',
    medium:attr.medium || 'unknown',
    campaign:attr.campaign || 'ds100_webinar_2026',
    content:attr.content || '',
    attribution_method:attr.attribution_method || '',
    first_referrer:attr.first_referrer || '',
    first_landing_url:attr.first_landing_url || '',
    referrer:document.referrer || attr.first_referrer || '',
    page_location:window.location.href,
    page_path:window.location.pathname,
    session:p.get('session') || '',
    cta:p.get('cta') || '',
    intent:p.get('intent') || ''
  };
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push(payload);
  rememberEvent(payload);
  console.info('[DS100 tracking]', payload);

  window.DS100TrackingDebug = function(){
    return {
      attribution:attr,
      url_params:{
        session:p.get('session') || '',
        cta:p.get('cta') || '',
        intent:p.get('intent') || ''
      },
      dataLayer:window.dataLayer || [],
      event_history:safeParse(sessionStorage.getItem('ds100_event_history') || '[]'),
      current_url:window.location.href,
      referrer:document.referrer || ''
    };
  };
})();
</script>

height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<div class="box">
  <div class="k">DS100 Webinar</div>
  <h1>Redirecting…</h1>
  <p>You are being redirected to the DS100 launch landing page.</p>
</div>
<script>
(function(){
  function safeParse(json){ try{return JSON.parse(json || '{}') || {}}catch(e){return {}} }
  function rememberEvent(payload){
    const events = safeParse(sessionStorage.getItem('ds100_event_history') || '[]');
    events.push({
      event: payload.event || '',
      source: payload.source || '',
      medium: payload.medium || '',
      campaign: payload.campaign || '',
      content: payload.content || '',
      cta: payload.cta || '',
      session: payload.session || '',
      intent: payload.intent || '',
      referrer: payload.referrer || '',
      page_location: payload.page_location || '',
      event_time: new Date().toISOString()
    });
    sessionStorage.setItem('ds100_event_history', JSON.stringify(events.slice(-50)));
  }
  const data = {"source": "sales_outreach", "medium": "direct_message", "campaign": "ds100_webinar_2026", "content": "sales_team", "term": ""};
  const existing = safeParse(localStorage.getItem('ds100_attribution') || '{}');
  const attribution = {
    ...existing,
    ...data,
    first_referrer: document.referrer || existing.first_referrer || '',
    first_landing_url: window.location.href,
    first_visit_time: existing.first_visit_time || new Date().toISOString(),
    attribution_method: 'clean_entry'
  };
  localStorage.setItem('ds100_attribution', JSON.stringify(attribution));
  window.dataLayer = window.dataLayer || [];
  const payload = {
    event:'source_entry',
    source: attribution.source,
    medium: attribution.medium,
    campaign: attribution.campaign,
    content: attribution.content,
    cta: '',
    session: '',
    intent: '',
    page_location: window.location.href,
    referrer: document.referrer || attribution.first_referrer || ''
  };
  window.dataLayer.push(payload);
  rememberEvent(payload);
  setTimeout(function(){ window.location.replace('../'); }, 250);
})();
</script>
